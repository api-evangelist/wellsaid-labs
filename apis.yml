  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.wellsaidlabs.com/reference/available-voice-avatars
  baseURL: https://api.wellsaidlabs.com/v1
  properties:
  - url: https://docs.wellsaidlabs.com/reference/available-voice-avatars
    type: Documentation
  - url: https://docs.wellsaidlabs.com/reference/getting-started-with-your-api
    type: APIReference
  - url: openapi/wellsaid-labs-openapi.yml
    type: OpenAPI
  description: List the available voice avatars with their metadata - the numeric
    speaker id, avatar name, style (Narration, Promo, Conversational, Character),
    language, accent, descriptive characteristics, and compatible models - so a
    client can pick the right voice for a text-to-speech render.
- aid: wellsaid-labs:wellsaid-labs-pronunciation-api
  name: WellSaid Labs Pronunciation API
  tags:
  - Pronunciation
