description: >-
  FinOps view of WellSaid Labs spend. The AI Voice Studio product is billed as a
  monthly or annual subscription (Trial, Starter, Pro) plus annually-billed team
  tiers (Business per seat, Enterprise custom), metered on downloaded voiceover
  minutes with extra minutes purchasable. Programmatic API spend is a separate
  business arrangement: production API access is gated behind a business plan and
  governed by a monthly character quota, so the primary API cost driver is
  characters synthesized per month rather than downloaded minutes. Studio prices
  are published; API per-character rates are quote-based.
notes: >-
  Studio subscription prices captured 2026-07-11 from wellsaid.io/ai-voice-pricing.
  API per-character pricing is not published and must be confirmed with WellSaid.
  The dominant API cost lever is the monthly character quota; the dominant Studio
  cost lever is downloaded minutes and seat count.
sources:
- https://www.wellsaid.io/ai-voice-pricing
- https://www.wellsaid.io/text-to-speech-api
- https://docs.wellsaidlabs.com/docs/api-specifications
