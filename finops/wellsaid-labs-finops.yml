publisherName: WellSaid Labs
serviceCategory: AI and Machine Learning
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
focusColumns:
  ServiceName: WellSaid Labs AI Voice
  ServiceCategory: AI and Machine Learning
  ProviderName: WellSaid Labs
  PublisherName: WellSaid Labs
  InvoiceIssuerName: WellSaid Labs
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Subscription-Based
meters:
- name: subscription_seats
  description: Studio subscription seats billed per plan (Starter, Pro, Business per user).
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - plan
- name: downloaded_minutes
  description: Voiceover minutes downloaded from the Studio, metered against the plan allowance.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - user
- name: api_characters
  description: Characters synthesized through the API, metered against the monthly character quota.
  unit: characters
  aggregation: sum
  dimensions:
  - account
  - api-key
- name: extra_minutes
  description: Additional voiceover minutes purchased beyond the plan allowance.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: >-
    Track API character consumption via the x-quota-remaining response header and
    Studio downloaded minutes per user against plan allowances.
- name: Allocation
  description: >-
    Map API keys to workloads/teams and Studio seats to users so voice spend maps
    to internal cost centers.
- name: Optimization
  description: >-
    Cache and reuse rendered clips instead of re-synthesizing identical text;
    keep requests within the 1,000-character limit and batch efficiently; choose
    the plan whose minute allowance matches actual usage to avoid extra-minute
    purchases.
- name: Accountability
  description: >-
    Assign owners per API key and Studio seat; review monthly character quota and
    downloaded-minute usage against the plan before renewal.
